project_title: mail
version: "0.1.3"
description: "A dynamically scaffolded c/cmake_app project"
stack: c/cmake_app
date_created: 2026-05-06

profile: default

# ── 1. Scaffolding Engine Source ──
base_templates:
  repo: https://github.com/contactandyc/scaffold-templates.git
  ref: main

# ── Dynamic Setup Variables ──
BUILD_VARIANT: "memory"
ubuntu_tag: "22.04"
cmake_version: "3.26.4"

# ── 3. Licenses & Legal ──
# license_profile: apache-2.0
# license_overrides:
#   "src/vendor/**": mit

# ── 4. Dependencies ──
depends_on:
  - https://github.com/contactandyc/a-json-library.git
  - https://github.com/contactandyc/a-memory-library.git
  - https://github.com/contactandyc/a-curl-library.git
  - https://github.com/contactandyc/a-curl-gcloud-plugin.git
  - https://github.com/contactandyc/an-oauth-library.git
  - https://github.com/contactandyc/the-io-library.git
  - https://github.com/contactandyc/h2o-c-library.git
  - common/sqlite3
# ── 5. Main Executable (Auto-Discovered) ──
# By default, all C/C++ files in src/ are compiled into an executable named 'my_app'.
# You can override this behavior explicitly:
main:
  targets:
    - name: mail
      sources:
       - src/main.c
       - src/db.c
       - src/agent.c
       - src/sync.c
    - name: test_send
      sources:
        - src/test_send.c

#       depends_on:
#         - https://github.com/contactandyc/the-io-library.git

